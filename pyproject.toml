[project]
name = "sustainreport-ai"
version = "0.1.0"
description = "ESG 지속가능경영보고서 초안 생성 시스템"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "sustainreport team" }
]
keywords = ["esg", "sustainability", "report", "gri", "tcfd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "markitdown[all]>=0.1.0",
    "jsonschema>=4.22.0",
    "litellm>=1.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
ocr = [
    # 스캔본 PDF 처리용 로컬 OCR
    # 시스템 의존성: brew install tesseract tesseract-lang poppler
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
]

[project.scripts]
sustainreport = "llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm"]

[tool.hatch.build.targets.sdist]
include = [
    "/CLAUDE.md",
    "/IMPLEMENTATION_GUIDE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
